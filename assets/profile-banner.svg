<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hian Lima — Security Research</title>
  <desc id="desc">Cyber-noir terminal banner highlighting AppSec, Recon Engineering, Malware Analysis, and Reverse Engineering.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030705"/>
      <stop offset="0.55" stop-color="#07110d"/>
      <stop offset="1" stop-color="#020504"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset="0.58" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff88" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H1200" stroke="#d7e0e0" stroke-opacity="0.018" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect x="24" y="24" width="1152" height="312" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#scan)"/>

  <g clip-path="url(#frameClip)" opacity="0.45" fill="#00ff88" font-family="monospace" font-size="10">
    <text x="39" y="65">0x00401000  55 48 89 E5 48 83 EC 20</text>
    <text x="890" y="305">SIG:4D415245 // TRACE:ACTIVE</text>
    <text x="930" y="79">00101101 01000001</text>
    <text x="52" y="315">RX: EVIDENCE // TX: KNOWLEDGE</text>
  </g>

  <rect x="24" y="24" width="1152" height="312" rx="8" fill="none" stroke="#1c3229" stroke-width="1"/>
  <path d="M24 56H1176" stroke="#1c3229"/>
  <circle cx="45" cy="40" r="4" fill="#ff4057"/>
  <circle cx="61" cy="40" r="4" fill="#d7aa3c"/>
  <circle cx="77" cy="40" r="4" fill="#00ff88"/>
  <text x="99" y="44" fill="#7a869a" font-family="monospace" font-size="11" letter-spacing="1.3">ROOT://HIAN_LIMA/SECURITY_RESEARCH</text>
  <text x="1085" y="44" fill="#00ff88" font-family="monospace" font-size="10">ONLINE</text>

  <g transform="translate(68 92)">
    <rect x="0" y="0" width="152" height="152" rx="8" fill="#06100c" stroke="#00ff88" stroke-opacity="0.48"/>
    <path d="M25 26H54V62H98V26H127V126H98V88H54V126H25Z" fill="none" stroke="#00ff88" stroke-width="7" filter="url(#glow)"/>
    <path d="M10 17H38M114 17H142M10 135H38M114 135H142" stroke="#00d9ff" stroke-width="2"/>
    <circle cx="76" cy="76" r="63" fill="none" stroke="#00d9ff" stroke-opacity="0.13" stroke-dasharray="3 8"/>
  </g>

  <g transform="translate(270 96)" font-family="monospace">
    <text x="0" y="18" fill="#00ff88" font-size="14" letter-spacing="3">&gt; WHOAMI</text>
    <text x="0" y="79" fill="#e7f1ed" font-size="50" font-weight="700" letter-spacing="3">HIAN LIMA</text>
    <rect x="0" y="98" width="730" height="2" fill="url(#neon)" filter="url(#glow)"/>
    <text x="0" y="132" fill="#9aacb2" font-size="17" letter-spacing="1.8">SECURITY RESEARCH // SYSTEMS // ANALYSIS</text>

    <g transform="translate(0 158)" font-size="12" letter-spacing="1">
      <rect x="0" y="0" width="98" height="28" rx="3" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-opacity="0.42"/>
      <text x="16" y="18" fill="#00ff88">APPSEC</text>
      <rect x="112" y="0" width="176" height="28" rx="3" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-opacity="0.42"/>
      <text x="128" y="18" fill="#00ff88">RECON ENGINEERING</text>
      <rect x="302" y="0" width="176" height="28" rx="3" fill="#00d9ff" fill-opacity="0.07" stroke="#00d9ff" stroke-opacity="0.38"/>
      <text x="318" y="18" fill="#00d9ff">MALWARE ANALYSIS</text>
      <rect x="492" y="0" width="202" height="28" rx="3" fill="#00d9ff" fill-opacity="0.07" stroke="#00d9ff" stroke-opacity="0.38"/>
      <text x="508" y="18" fill="#00d9ff">REVERSE ENGINEERING</text>
    </g>
  </g>

  <g font-family="monospace" font-size="11">
    <text x="270" y="310" fill="#7a869a">[MODE]</text>
    <text x="320" y="310" fill="#d7e0e0">EVIDENCE &gt; ASSUMPTIONS</text>
    <text x="548" y="310" fill="#7a869a">[BUILD]</text>
    <text x="606" y="310" fill="#d7e0e0">SYSTEMS THAT PRESERVE CONTEXT</text>
  </g>

  <path d="M24 335H400" stroke="#00ff88" stroke-width="2"/>
  <path d="M400 335H1176" stroke="#00d9ff" stroke-opacity="0.18"/>
</svg>
